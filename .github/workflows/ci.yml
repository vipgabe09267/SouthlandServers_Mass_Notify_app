name: Windows validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Check dependency advisories
        run: python tools/audit_build_dependencies.py
      - name: Test and build development package
        shell: powershell
        run: ./build-installer.ps1 -Clean -PythonExecutable (Get-Command python.exe).Source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UNSIGNED-development-package
          path: |
            dist/packages/SLS_Mass_Notify_Installer.zip
            dist/packages/SLS_Mass_Notify_Installer.zip.sha256
          retention-days: 7
          if-no-files-found: error
